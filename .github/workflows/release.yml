name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build release archive
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\release.ps1
      - name: Replace the release for this tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release delete $tag --yes --cleanup-tag=false 2>$null
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $tag $files --title ("CapRouter " + $tag.TrimStart("v")) --notes-file "dist/RELEASE-NOTES.md"
