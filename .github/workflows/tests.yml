name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: CLI smoke
        run: python bin/caprouter.py --version
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install and run wheel
        run: |
          python -m pip install --force-reinstall --no-deps --find-links dist caprouter
          caprouter --version
