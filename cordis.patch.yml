- insert:
    - id: mcp-caprouter
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: caprouter
        transport: stdio
        command: !!js 'process.env.CAPROUTER_PYTHON || (process.platform === "win32" ? "py" : "python3")'
        args:
          - -m
          - caprouter
          - mcp
          - --tools
          - core
          - --host
          - deepseek-harness
        startupTimeoutMs: 15000
        toolCallTimeoutMs: 120000
        failOnStartupError: true
