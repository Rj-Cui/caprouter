[build-system]
# 61 keeps `pip install .` working with the setuptools that ships alongside
# older Python 3.11 installs and without network access to fetch a newer build
# backend. Newer setuptools is still fine.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caprouter"
version = "0.7.2"
description = "Local capability registry, router, verifier and MCP bus for AI-agent skills, plugins and scripts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CapRouter contributors" }]
keywords = [
  "ai-agents",
  "agent-skills",
  "mcp",
  "routing",
  "verification",
  "audit",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Rj-Cui/caprouter"
Repository = "https://github.com/Rj-Cui/caprouter"
Issues = "https://github.com/Rj-Cui/caprouter/issues"

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10"]

[project.scripts]
caprouter = "caprouter.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["caprouter*"]
exclude = ["tests*", "eval*"]
